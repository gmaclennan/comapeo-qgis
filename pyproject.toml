[project]
name = "comapeo-qgis"
version = "0.1.0"
description = "QGIS plugin showing CoMapeo projects as map layers"
license = "GPL-2.0-or-later"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = ["real_server: runs against the @comapeo/local-api dev server"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["docs", ".venv", ".qgis-pytest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"scripts/smoke_*.py" = ["S101", "S108", "S603"]
